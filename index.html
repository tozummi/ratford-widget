<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f3eee5"
  >

  <title>Ratford Bridge Farmhouse</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>
  <main class="property-widget">

    <!-- Property photograph -->
    <div
      class="property-image"
      aria-hidden="true"
    ></div>

    <!-- Soft fade between the text and image -->
    <div
      class="image-overlay"
      aria-hidden="true"
    ></div>

    <div class="widget-content">

      <!-- Small details over the photograph -->
      <div class="arrival-card">
        <div class="arrival-item">
          <span>Check in</span>
          <strong>3pm</strong>
        </div>

        <div class="arrival-divider"></div>

        <div class="arrival-item">
          <span>Checkout</span>
          <strong>10am</strong>
        </div>
      </div>

      <!-- Main property information -->
      <section class="property-heading">
        <p class="location">
          <span class="location-pin"></span>
          Calne, Wiltshire
        </p>

        <h1>
          Ratford Bridge
          <span>Farmhouse</span>
        </h1>

        <p class="stay-dates">
          Monday 17 – Friday 21 August 2026
        </p>
      </section>

      <!-- Weather banner -->
      <section class="weather-panel">

        <div class="weather-header">
          <div>
            <span class="weather-label">
              Five-day outlook
            </span>

            <h2>Stay forecast</h2>
          </div>

          <span class="weather-location">
            Ratford Bridge
          </span>
        </div>

        <div
          class="forecast-grid"
          id="forecast-grid"
        ></div>

        <div class="weather-footer">
          <span>High / low temperature</span>
          <span>Example forecast: 27–31 July</span>
        </div>

      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

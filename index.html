<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f3eee5"
  >

  <title>Ratford Bridge Farmhouse</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>
  <main class="property-widget">

    <!-- Top row -->
    <section class="property-header">

      <!-- Property writing -->
      <div class="property-heading">
        <p class="location">
          <span class="location-pin"></span>
          Calne, Wiltshire
        </p>

        <h1>
          Ratford Bridge
          <span>Farmhouse</span>
        </h1>

        <p class="stay-dates">
          17–21 August 2026
        </p>
      </div>

      <!-- Property photograph -->
      <div class="property-image">

        <div class="arrival-card">
          <div class="arrival-item">
            <span>Check in</span>
            <strong>3pm</strong>
          </div>

          <div class="arrival-divider"></div>

          <div class="arrival-item">
            <span>Checkout</span>
            <strong>10am</strong>
          </div>
        </div>

      </div>

    </section>

    <!-- Bottom information strip -->
    <section class="information-row">

      <!-- Guest summary -->
      <div class="guest-summary">

        <div class="guest-total">
          <strong>24</strong>
          <span>Guests</span>
        </div>

        <div class="guest-divider"></div>

        <div class="guest-breakdown">
          <span><strong>16</strong> adults</span>
          <span><strong>5</strong> children</span>
          <span><strong>3</strong> babies</span>
        </div>

      </div>

      <!-- Weather forecast -->
      <div class="weather-panel">

        <div class="weather-heading">
          <div>
            <span>Monday to Friday</span>
            <strong>Five-day forecast</strong>
          </div>

          <small>High / low</small>
        </div>

        <div
          class="forecast-grid"
          id="forecast-grid"
        ></div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>

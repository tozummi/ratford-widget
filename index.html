<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f3eee5"
  >

  <title>Ratford Bridge Farmhouse</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>
  <main class="property-widget">

    <div
      class="property-image"
      aria-hidden="true"
    ></div>

    <div
      class="image-overlay"
      aria-hidden="true"
    ></div>

    <!-- Small check-in information over the photograph -->
    <div class="arrival-card">
      <div class="arrival-item">
        <span>Check in</span>
        <strong>3pm</strong>
      </div>

      <div class="arrival-divider"></div>

      <div class="arrival-item">
        <span>Checkout</span>
        <strong>10am</strong>
      </div>
    </div>

    <div class="widget-content">

      <!-- Property information -->
      <section class="property-heading">
        <p class="location">
          <span class="location-pin"></span>
          Calne, Wiltshire
        </p>

        <h1>
          Ratford Bridge
          <span>Farmhouse</span>
        </h1>

        <p class="stay-dates">
          17–21 August 2026
        </p>
      </section>

      <!-- Bottom information area -->
      <section class="bottom-section">

        <!-- Guest summary -->
        <div class="guest-summary">
          <div class="guest-item">
            <strong>24</strong>
            <span>Guests</span>
          </div>

          <div class="guest-divider"></div>

          <div class="guest-breakdown">
            <span>16 adults</span>
            <span>5 children</span>
            <span>3 babies</span>
          </div>
        </div>

        <!-- Weather -->
        <div class="weather-panel">

          <div class="weather-header">
            <div>
              <span class="weather-label">
                Monday to Friday
              </span>

              <h2>Five-day forecast</h2>
            </div>

            <span class="weather-location">
              Ratford Bridge
            </span>
          </div>

          <div
            class="forecast-grid"
            id="forecast-grid"
          ></div>

        </div>

      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
